[package]
name = "qsyn-stream"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
