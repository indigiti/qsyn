name: QSYN Seven Venue Live Acceptance

on:
  push:
    branches: ["probe/crypto-seven-venue-staging"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsyn-public-crypto-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-crypto:
    name: Observe seven public crypto feeds on staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify all venues with fresh WebSocket updates and advancing candles
        shell: bash
        run: |
          set -o pipefail
          python3 services/stream-rust/tests/crypto_public_observe.py \
            --base-url https://stage.digiti.in \
            --observe-seconds 90 \
            --sample-seconds 20 \
            --require-websocket 2>&1 | tee qsyn-crypto-seven-venue-report.txt
      - name: Preserve probe report even when a provider fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsyn-crypto-seven-venue-live-report
          path: qsyn-crypto-seven-venue-report.txt
          if-no-files-found: warn
          retention-days: 7
