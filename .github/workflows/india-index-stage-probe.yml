name: QSYN India Index Staging Acceptance
on:
  push:
    branches: [probe/india-index-stage-240]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify release #240 India catalog is deployed and licensed data stays gated
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.error, urllib.request
          base='https://stage.digiti.in/qsyn/api/v1/'
          def fetch(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'QSYN-India-staging-probe/1','Accept':'application/json'}),timeout=16) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as exc:
                  return exc.code,json.loads(exc.read())
          status,catalog=fetch('india/indexes')
          assert status==200 and catalog['schema']=='QSYN-INDIA-INDEX-CATALOG/1',(status,catalog)
          assert not catalog['live_data_available'] and not catalog['public_redistribution_allowed']
          assert len(catalog['indexes'])==6,catalog
          print('PASS index catalog:',[(x['exchange'],x['name']) for x in catalog['indexes']])
          status,denied=fetch('india/bars?exchange=NSE_INDEX&symbol=NIFTY&interval=1m&limit=300')
          assert status==503 and denied['error']=='india_index_feed_not_authorized',(status,denied)
          print('PASS live NSE data unlicensed request denied',status)
          status,invalid=fetch('india/bars?exchange=NSE_INDEX&symbol=../etc&interval=1m&limit=300')
          assert status==422,(status,invalid)
          print('PASS NSE index invalid instrument rejected')
          status,crypto=fetch('crypto/health?exchange=BINANCE&market=spot&symbol=BTCUSDT&interval=1m&limit=5')
          assert status==200 and crypto['schema']=='QSYN-PUBLIC-CRYPTO-HEALTH/1',(status,crypto)
          print('PASS existing Binance public feed health',crypto['feed']['state'])
          PY
