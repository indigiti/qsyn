name: QSYN Stage Historical Acceptance

on:
  workflow_dispatch:
    inputs:
      bars:
        description: 'Real Binance BTCUSDT 1m candles to validate on deployed staging'
        required: true
        default: '1600'
        type: choice
        options:
          - '1600'
          - '15016'
      runner_mode:
        description: 'GitHub-hosted (diagnose WAF) or dedicated trusted self-hosted fixed-egress runner'
        required: true
        default: 'github-hosted'
        type: choice
        options:
          - 'github-hosted'
          - 'trusted-self-hosted'

permissions:
  contents: read

jobs:
  verify-stage:
    name: Verify deployed stage history
    # Dispatch only from reviewed main. A dedicated private Linux x64 runner
    # is optional and must be assigned the qsyn-stage-acceptance label.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner_mode == 'trusted-self-hosted' && fromJSON('["self-hosted","linux","x64","qsyn-stage-acceptance"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test validation logic against deterministic mock exchange data
        run: node --test ops/verify-public-backfill.test.mjs
      - name: Identify which staging endpoint rejects GitHub-hosted requests
        run: node ops/probe-stage-access.mjs > stage-access-report.json
      - name: Probe actual read-only Binance public history on Cloudways staging
        id: history
        continue-on-error: true
        env:
          QSYN_BARS: ${{ inputs.bars }}
        run: |
          node ops/verify-public-backfill.mjs --base https://stage.digiti.in/qsyn --bars "$QSYN_BARS" > stage-backfill-report.json 2> stage-backfill-error.json || {
            cat stage-backfill-error.json
            cp stage-backfill-error.json stage-backfill-report.json
            exit 1
          }
          cat stage-backfill-report.json
      - name: Install test-only Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium system dependencies on disposable GitHub-hosted runner
        if: inputs.runner_mode == 'github-hosted'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium browser on dedicated trusted runner
        # System Chromium dependencies MUST be preinstalled by the runner operator.
        # No sudo or OS package changes should occur in a production environment.
        if: inputs.runner_mode == 'trusted-self-hosted'
        run: npx playwright install chromium
      - name: Verify deployed React chart actually auto-loads 1600 candles
        id: chart
        continue-on-error: true
        run: node ops/verify-stage-chart.mjs
      - name: Preserve stage acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsyn-stage-history-acceptance
          path: |
            stage-backfill-report.json
            stage-chart-report.json
            stage-access-report.json
          if-no-files-found: warn
      - name: Fail closed unless both live API and Chromium acceptance passed
        if: always()
        env:
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
          CHART_OUTCOME: ${{ steps.chart.outcome }}
        run: |
          echo "Live history acceptance: $HISTORY_OUTCOME"
          echo "Live Chromium acceptance: $CHART_OUTCOME"
          if [[ "$HISTORY_OUTCOME" != success || "$CHART_OUTCOME" != success ]]; then
            echo "::error::Stage acceptance not verified; download sanitized JSON artifacts and check Cloudways/WAF logs for matching 403 requests."
            exit 1
          fi
