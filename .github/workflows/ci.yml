name: QSYN CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-footprint:
    name: Rust footprint guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block unreviewed Rust binary targets and release profile regressions
        run: python3 ops/rust_footprint_guard.py source .
      - name: Verify fail-closed regression tests
        run: python3 -m unittest discover -s ops -p 'test_rust_footprint_guard.py' -v

  php:
    name: PHP file-store and HTTP demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
          coverage: none
      - name: Syntax checks and FileStore tests
        run: |
          php -l apps/web-php/src/FileStore.php
          php -l apps/web-php/public/index.php
          php -l apps/web-php/src/TerminalRoutes.php
          php apps/web-php/tests/TerminalRoutesTest.php
          php -l apps/web-php/src/TerminalAdminGate.php
          php -l apps/web-php/public/terminal-login.php
          python3 apps/web-php/tests/TerminalAdminGateHttpSmoke.py
          php -l apps/web-php/public/terminal.php
          php -l apps/web-php/src/RustProbe.php
          php -l apps/web-php/src/RustStreamProbe.php
          php -l apps/web-php/src/RustAdmin.php
          php -l apps/web-php/src/RustAdminBootstrap.php
          php -l apps/web-php/tools/make-admin-config.php
          php -l apps/web-php/src/RustDemoConfig.php
          php -l apps/web-php/src/RustSupervisor.php
          php -l apps/web-php/public/admin-rust.php
          php -l apps/web-php/dev-router.php
          php -l apps/web-php/src/BrokerConnectionRepository.php
          php -l apps/web-php/src/FileMockBrokerConnectionRepository.php
          php apps/web-php/tests/FileStoreTest.php
          php apps/web-php/tests/MockBrokerConnectionRepositoryTest.php
          php -l apps/web-php/src/UserRepository.php
          php -l apps/web-php/src/FileUserRepository.php
          php -l apps/web-php/src/IdentityThrottle.php
          php -l apps/web-php/src/UserSession.php
          php -l apps/web-php/src/IdentityApi.php
          php -l apps/web-php/tests/IdentityContractsTest.php
          php apps/web-php/tests/IdentityContractsTest.php
          python3 apps/web-php/tests/IdentityHttpSmoke.py
          php -l apps/web-php/src/FileTerminalWorkspaceRepository.php
          php -l apps/web-php/src/TerminalWorkspaceApi.php
          python3 apps/web-php/tests/TerminalWorkspaceHttpSmoke.py
          php -l apps/web-php/src/PrivateChartGrantApi.php
          python3 apps/web-php/tests/PrivateChartGrantHttpSmoke.py
          php -l apps/web-php/src/OperatorIndexChartGrantApi.php
          python3 apps/web-php/tests/OperatorIndexChartGrantHttpSmoke.py
          php -l apps/web-php/src/UpstoxOperatorOAuth.php
          php -l apps/web-php/tools/upstox-oauth.php
          php apps/web-php/tests/UpstoxOperatorOAuthTest.php
          php -l apps/web-php/src/NativeUpstoxWebApi.php
          python3 apps/web-php/tests/NativeUpstoxWebHttpSmoke.py
          php -l apps/web-php/src/NativeUpstoxAnalyticsApi.php
          php apps/web-php/tests/NativeUpstoxAnalyticsApiTest.php
          python3 apps/web-php/tests/NativeUpstoxAnalyticsHttpSmoke.py
          php -l apps/web-php/src/NativeUpstoxProfileVerifier.php
          php apps/web-php/tests/NativeUpstoxProfileVerifierTest.php
          php -l apps/web-php/src/NativeUpstoxIndexDiscovery.php
          php apps/web-php/tests/NativeUpstoxIndexDiscoveryTest.php
          php -l apps/web-php/src/NativeAdminDiagnostics.php
          python3 apps/web-php/tests/NativeAdminDiagnosticsHttpSmoke.py
          php -l apps/web-php/src/FileMockAccountSelection.php
          php -l apps/web-php/src/AccountApi.php
          php -l apps/web-php/src/SimulatedAccountBars.php
          php -l apps/web-php/public/account-dashboard.php
          python3 apps/web-php/tests/AccountHttpSmoke.py
          php apps/web-php/tests/SimulatedAccountBarsTest.php
          php -l apps/web-php/src/FileMockWorkspaceRepository.php
          php -l apps/web-php/src/FileMockAuditLog.php
          php -l apps/web-php/tests/WorkspaceAuditTest.php
          php apps/web-php/tests/WorkspaceAuditTest.php
          php -l apps/web-php/tools/verify-mock-audit.php
          php -l apps/web-php/tools/phase1-stage-preflight.php
          php -l apps/web-php/tests/PrivateStageGateTest.php
          php apps/web-php/tests/PrivateStageGateTest.php
          python3 apps/web-php/tests/PublicStageProbeTest.py
          python3 -m py_compile apps/web-php/tests/PrivateIngressProbe.py apps/web-php/tests/VerifyPrivateIngressEvidence.py apps/web-php/tests/PrivateIngressProbeTest.py
          python3 apps/web-php/tests/PrivateIngressProbeTest.py
          python3 -m py_compile apps/web-php/tests/PrivateBaselineProbe.py apps/web-php/tests/PrivateBaselineProbeTest.py
          python3 apps/web-php/tests/PrivateBaselineProbeTest.py
          php -l apps/web-php/src/IndiaIndexCatalog.php
          php apps/web-php/tests/IndiaIndexCatalogTest.php
          php -l apps/web-php/src/UpstoxIndexV3.php
          php apps/web-php/tests/UpstoxIndexV3Test.php
          php -l apps/web-php/src/SimulatedOptionsStudio.php
          php -l apps/web-php/public/studio.php
          php apps/web-php/tests/SimulatedOptionsStudioTest.php
          php -l apps/web-php/src/StudioAnalytics.php
          php apps/web-php/tests/StudioAnalyticsTest.php
          python3 apps/web-php/tests/StudioIntegratedHttpTest.py
          php -l apps/web-php/src/OpenAlgoLocalProbe.php
          php -l apps/web-php/tools/openalgo-local-probe.php
          python3 apps/web-php/tests/OpenAlgoLocalProbeTest.py
          python3 apps/web-php/tests/UpstoxInstrumentInspectTest.py
          php -l apps/web-php/src/PrivateBrokerRegistry.php
          php -l apps/web-php/src/PrivateOpenAlgoReader.php
          php -l apps/web-php/tools/private-broker-gateway.php
          python3 apps/web-php/tests/PrivateBrokerGatewayTest.py
          php -l apps/web-php/tools/openalgo-upstox-readiness.php
          python3 apps/web-php/tests/OpenAlgoUpstoxReadinessTest.py
          php -l apps/web-php/src/OpenAlgoAdminWebApi.php
          python3 apps/web-php/tests/OpenAlgoAdminWebHttpSmoke.py
          php -l apps/web-php/src/OpenAlgoAdminSetup.php
          python3 apps/web-php/tests/OpenAlgoAdminWebSetupHttpSmoke.py
          php -l apps/web-php/src/OpenAlgoBrokerConnectionsApi.php
          php apps/web-php/tests/OpenAlgoBrokerConnectionsTest.php
          python3 apps/web-php/tests/OpenAlgoBrokerConnectionsHttpSmoke.py
          php -l apps/web-php/tools/private-history-export.php
          python3 apps/web-php/tests/PrivateHistoryExportTest.py
          php -l apps/web-php/tools/private-demo-fixtures.php
          python3 apps/web-php/tests/PrivateDemoFixtureTest.py
          php -l apps/web-php/tools/private-deployment-preflight.php
          python3 apps/web-php/tests/PrivateDeploymentPreflightTest.py
          php apps/web-php/tools/phase1-stage-preflight.php
          if QSYN_IDENTITY_ENABLED=1 php apps/web-php/tools/phase1-stage-preflight.php; then
            echo 'ERROR: enabled test identity escaped staging preflight' >&2
            exit 1
          fi
          php apps/web-php/tests/RustAdminTest.php
          php apps/web-php/tests/RustAdminBootstrapTest.php
          php apps/web-php/tests/RustDemoConfigTest.php
      - name: Validate offline administrator config generator
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          printf '%s\n' 'ci-test-password-strong-unique-1234567890' | php apps/web-php/tools/make-admin-config.php "$root/admin-auth.json"
          test "$(stat -c '%a' "$root/admin-auth.json")" = 600
          php -r '
            $c=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            if (($c["schema"]??"")!=="QSYN-ADMIN/1" || ($c["enabled"]??null)!==true || !password_verify("ci-test-password-strong-unique-1234567890",$c["password_hash"]??"")) exit(1);
          ' "$root/admin-auth.json"
      - name: Demo endpoint smoke test
        run: |
          QSYN_ALLOW_HTTP_TEST=1 php -S 127.0.0.1:18080 -t apps/web-php/public apps/web-php/dev-router.php > /tmp/qsyn-php.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080/qsyn/api/v1/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18080/qsyn/api/v1/demo/bars | grep -q '"mode":"simulated"'
          curl --fail --silent http://127.0.0.1:18080/qsyn/api/v1/diagnostics/rust | grep -q '"status":"offline"'
          curl --fail --silent http://127.0.0.1:18080/qsyn/api/v1/diagnostics/rust-stream | grep -q '"status":"offline"'
          curl --fail --silent http://127.0.0.1:18080/qsyn/api/v1/admin/rust/state | grep -q '"configured":false'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/qsyn/admin/rust)" = 303
          curl --silent -D - -o /dev/null http://127.0.0.1:18080/qsyn/admin/rust | grep -qi '^Location: /qsyn/terminal/login'
          curl --silent -D - -o /dev/null http://127.0.0.1:18080/qsyn/studio/ | grep -qi '^Location: /qsyn/terminal/login'
          curl --silent -D - -o /dev/null http://127.0.0.1:18080/qsyn/legacy-chart | grep -qi '^Location: /qsyn/terminal/login'
          # Anonymous terminal visitors must be redirected BEFORE routing
          # or looking for a missing React bundle.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/qsyn/terminal/markets)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/qsyn/terminal/unknown)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/qsyn/terminal/markets)" = 405
          curl --silent -D - -o /dev/null 'http://127.0.0.1:18080/qsyn/terminal?view=dashboard' | grep -qi '^Location: /qsyn/terminal/login'
          curl --fail --silent http://127.0.0.1:18080/qsyn/api/v1/india/indexes | grep -q 'QSYN-INDIA-INDEX-CATALOG/1'
          test "$(curl --silent -o /tmp/qsyn-india.json -w '%{http_code}' 'http://127.0.0.1:18080/qsyn/api/v1/india/bars?exchange=NSE_INDEX&symbol=NIFTY&interval=1m')" = 503
          grep -q 'india_index_feed_not_authorized' /tmp/qsyn-india.json
          test "$(curl --silent -o /tmp/qsyn-india.json -w '%{http_code}' 'http://127.0.0.1:18080/qsyn/api/v1/india/bars?exchange=NSE_INDEX&symbol=../etc&interval=1m')" = 422
          # Historical before-cursor is bars-only, UTC-aligned, bounded and strictly numeric.
          test "$(curl --silent -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/qsyn/api/v1/crypto/bars?exchange=BINANCE&market=spot&symbol=BTCUSDT&interval=1m&before=not-a-timestamp')" = 422
          test "$(curl --silent -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/qsyn/api/v1/crypto/bars?exchange=BINANCE&market=spot&symbol=BTCUSDT&interval=1m&before=1696982410')" = 422
          test "$(curl --silent -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/qsyn/api/v1/crypto/health?exchange=BINANCE&market=spot&symbol=BTCUSDT&interval=1m&before=1696982400')" = 422
          # Health checks do not trigger new exchange subscriptions.
          test "$(curl --silent -o /tmp/qsyn-crypto-health.json -w '%{http_code}' 'http://127.0.0.1:18080/qsyn/api/v1/crypto/health?exchange=BINANCE&market=spot&symbol=../bad&interval=1m')" = 422
          grep -q 'invalid_crypto_request' /tmp/qsyn-crypto-health.json
          # No Rust worker in the PHP CI job: the fixed loopback check fails closed.
          test "$(curl --silent -o /tmp/qsyn-crypto-health.json -w '%{http_code}' 'http://127.0.0.1:18080/qsyn/api/v1/crypto/health?exchange=BINANCE&market=spot&symbol=BTCUSDT&interval=1m')" = 503
          python3 -m py_compile services/stream-rust/tests/crypto_public_observe.py

  rust:
    name: Rust synthetic engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path services/stream-rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path services/stream-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path services/stream-rust/Cargo.toml
      - name: Build and exercise Rust HTTP + WebSocket service
        run: |
          cargo build --manifest-path services/stream-rust/Cargo.toml
          QSYN_MARKET_ARCHIVE_BINARY=services/stream-rust/target/debug/qsyn-market-archive python3 services/stream-rust/tests/market_archive_cli_smoke.py
          python3 services/stream-rust/tests/smoke_service.py
          python3 services/stream-rust/tests/direct_control_smoke.py
          python3 services/stream-rust/tests/auto_activation_smoke.py
          python3 apps/web-php/tests/RustWebProbeSmoke.py

  charts:
    name: OpenAlgo Charts production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
          coverage: none
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: node --check src/main.js
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify shared pretty URL registry
        run: node tests/terminal-routes-contract.mjs
        working-directory: frontend
      - name: Verify India index native discovery and strict license gates
        run: node tests/india-index-contract.mjs
        working-directory: frontend
      - name: Confirm chart-cancellation guard never masks app errors
        run: node tests/chart-cancellation-contract.mjs
        working-directory: frontend
      - name: Verify Wick Science MFE indicator state machine and signal safety
        run: node tests/wick-science.test.mjs
        working-directory: frontend
      - name: Check stage acceptance probe against 1600- and 15016-candle fixtures
        run: |
          node --test ops/verify-public-backfill.test.mjs ops/probe-stage-access.test.mjs ops/trusted-stage-runner.test.mjs
          node --check ops/verify-stage-chart.mjs
          node --check ops/probe-stage-access.mjs
      - name: Verify provider-backed automatic max history, native paging and polling safety
        run: node tests/crypto-backfill.test.mjs
        working-directory: frontend
      - run: |
          test -s frontend/dist/chart.js
          test -s frontend/dist/terminal.js
          test -s frontend/dist/terminal.css
      - name: Install test-only Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify initial 1600-candle Chromium auto-backfill and native Wick study
        run: node tests/browser-crypto-backfill-smoke.mjs
        working-directory: frontend
      - name: Check real-browser candlestick rendering and CSP
        run: node tests/browser-chart-smoke.mjs
        working-directory: frontend
      - name: Check account dashboard, role isolation and simulated chart painting
        run: node tests/browser-account-dashboard-smoke.mjs
        working-directory: frontend
      - name: Check synthetic Options Studio, multi-chart rendering and saved layouts
        run: node tests/browser-studio-smoke.mjs
        working-directory: frontend
      - name: Validate strict browser workspace state and simulated instrument whitelist
        run: node --test tests/terminal-workspace.test.mjs tests/terminal-file-sync.test.mjs tests/private-live-chart.test.mjs tests/indicator-legend-settings.test.mjs
        working-directory: frontend
      - name: Verify research-only premium breakout and synthetic trend backtest rules
        run: node --test tests/premium-breakout.test.mjs
        working-directory: frontend
      - name: Validate database-free OpenAlgo-style terminal in desktop/mobile Chromium
        run: node tests/browser-terminal-smoke.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qsyn-chart-browser-screenshots
          path: frontend/artifacts/*.png
          if-no-files-found: ignore
