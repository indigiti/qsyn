name: QSYN DigiOps Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'apps/**'
      - 'frontend/**'
      - 'services/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'frontend/**'
      - 'services/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  package:
    name: Build and validate DigiOps payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Test PHP
        run: |
          php -l apps/web-php/public/index.php
          php -l apps/web-php/src/RustProbe.php
          php -l apps/web-php/src/RustStreamProbe.php
          php -l apps/web-php/src/RustAdmin.php
          php -l apps/web-php/src/RustAdminBootstrap.php
          php -l apps/web-php/tools/make-admin-config.php
          php -l apps/web-php/src/RustDemoConfig.php
          php -l apps/web-php/src/RustSupervisor.php
          php -l apps/web-php/public/admin-rust.php
          php -l apps/web-php/src/BrokerConnectionRepository.php
          php -l apps/web-php/src/FileMockBrokerConnectionRepository.php
          php apps/web-php/tests/FileStoreTest.php
          php apps/web-php/tests/MockBrokerConnectionRepositoryTest.php
          php -l apps/web-php/src/UserRepository.php
          php -l apps/web-php/src/FileUserRepository.php
          php -l apps/web-php/src/IdentityThrottle.php
          php -l apps/web-php/src/UserSession.php
          php -l apps/web-php/src/IdentityApi.php
          php -l apps/web-php/tests/IdentityContractsTest.php
          php apps/web-php/tests/IdentityContractsTest.php
          python3 apps/web-php/tests/IdentityHttpSmoke.py
          php -l apps/web-php/src/FileMockAccountSelection.php
          php -l apps/web-php/src/AccountApi.php
          php -l apps/web-php/src/SimulatedAccountBars.php
          php -l apps/web-php/public/account-dashboard.php
          python3 apps/web-php/tests/AccountHttpSmoke.py
          php apps/web-php/tests/SimulatedAccountBarsTest.php
          php -l apps/web-php/src/FileMockWorkspaceRepository.php
          php -l apps/web-php/src/FileMockAuditLog.php
          php -l apps/web-php/tests/WorkspaceAuditTest.php
          php apps/web-php/tests/WorkspaceAuditTest.php
          php apps/web-php/tests/RustAdminTest.php
          php apps/web-php/tests/RustAdminBootstrapTest.php
          php apps/web-php/tests/RustDemoConfigTest.php
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and compile Rust binary
        env:
          QSYN_SOURCE_SHA: ${{ github.sha }}
        run: |
          cargo test --manifest-path services/stream-rust/Cargo.toml
          cargo build --release --manifest-path services/stream-rust/Cargo.toml
          QSYN_RUST_BINARY=services/stream-rust/target/release/qsyn-stream python3 services/stream-rust/tests/smoke_service.py
          QSYN_RUST_BINARY=services/stream-rust/target/release/qsyn-stream python3 services/stream-rust/tests/direct_control_smoke.py
          QSYN_RUST_BINARY=services/stream-rust/target/release/qsyn-stream python3 services/stream-rust/tests/auto_activation_smoke.py
          QSYN_RUST_BINARY=services/stream-rust/target/release/qsyn-stream python3 apps/web-php/tests/RustWebProbeSmoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build chart bundle
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Stage DigiOps-compatible release
        shell: bash
        run: |
          set -euo pipefail
          # DigiOps adds the configured public_html/qsyn and private_html/qsyn
          # destination prefixes. Do NOT put those paths in the artifact.
          mkdir -p staging/public/{assets,licenses}
          mkdir -p staging/private/app/{src,bin}
          mkdir -p staging/private/build
          # The private runtime directory survives subsequent overlays. Only
          # a harmless marker is packaged; never include admin-auth.json.
          mkdir -p staging/private/runtime
          printf 'QSYN private runtime; never store credentials in release artifacts.\n' > staging/private/runtime/README.txt
          cp apps/web-php/public/index.php staging/public/index.php
          cp apps/web-php/public/admin-rust.php staging/public/admin-rust.php
          cp apps/web-php/public/.htaccess staging/public/.htaccess
          cp frontend/dist/chart.js staging/public/assets/chart.js
          cp frontend/dist/account-chart.js staging/public/assets/account-chart.js
          cp apps/web-php/public/assets/account-dashboard.js staging/public/assets/account-dashboard.js
          cp apps/web-php/public/assets/account-dashboard.css staging/public/assets/account-dashboard.css
          cp apps/web-php/public/account-dashboard.php staging/public/account-dashboard.php
          cp apps/web-php/public/assets/rust-diagnostics.js staging/public/assets/rust-diagnostics.js
          cp apps/web-php/public/assets/chart-diagnostics.js staging/public/assets/chart-diagnostics.js
          cp apps/web-php/public/assets/rust-stream-test.js staging/public/assets/rust-stream-test.js
          cp apps/web-php/public/assets/rust-admin.js staging/public/assets/rust-admin.js
          cp apps/web-php/public/assets/rust-activation-readiness.js staging/public/assets/rust-activation-readiness.js
          cp frontend/node_modules/openalgo-charts/LICENSE staging/public/licenses/openalgo-charts-LICENSE.txt
          if [ -f frontend/node_modules/openalgo-charts/NOTICE ]; then
            cp frontend/node_modules/openalgo-charts/NOTICE staging/public/licenses/openalgo-charts-NOTICE.txt
          fi
          cp apps/web-php/src/FileStore.php staging/private/app/src/FileStore.php
          cp apps/web-php/src/BrokerConnectionRepository.php staging/private/app/src/BrokerConnectionRepository.php
          cp apps/web-php/src/FileMockBrokerConnectionRepository.php staging/private/app/src/FileMockBrokerConnectionRepository.php
          cp apps/web-php/src/UserRepository.php staging/private/app/src/UserRepository.php
          cp apps/web-php/src/FileUserRepository.php staging/private/app/src/FileUserRepository.php
          cp apps/web-php/src/IdentityThrottle.php staging/private/app/src/IdentityThrottle.php
          cp apps/web-php/src/UserSession.php staging/private/app/src/UserSession.php
          cp apps/web-php/src/IdentityApi.php staging/private/app/src/IdentityApi.php
          cp apps/web-php/src/FileMockAccountSelection.php staging/private/app/src/FileMockAccountSelection.php
          cp apps/web-php/src/AccountApi.php staging/private/app/src/AccountApi.php
          cp apps/web-php/src/SimulatedAccountBars.php staging/private/app/src/SimulatedAccountBars.php
          cp apps/web-php/src/FileMockWorkspaceRepository.php staging/private/app/src/FileMockWorkspaceRepository.php
          cp apps/web-php/src/FileMockAuditLog.php staging/private/app/src/FileMockAuditLog.php
          cp apps/web-php/src/RustProbe.php staging/private/app/src/RustProbe.php
          cp apps/web-php/src/RustStreamProbe.php staging/private/app/src/RustStreamProbe.php
          cp apps/web-php/src/RustAdmin.php staging/private/app/src/RustAdmin.php
          cp apps/web-php/src/RustAdminBootstrap.php staging/private/app/src/RustAdminBootstrap.php
          cp apps/web-php/src/RustDemoConfig.php staging/private/app/src/RustDemoConfig.php
          cp apps/web-php/src/RustSupervisor.php staging/private/app/src/RustSupervisor.php
          cp services/stream-rust/target/release/qsyn-stream staging/private/app/bin/qsyn-stream
          cat > staging/RELEASE.json <<EOF
          {
            "schema": "DIGIOPS-BUILD/1",
            "name": "QSYN",
            "version": "0.1.0-phase0",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sourceSha": "$GITHUB_SHA",
            "branch": "$GITHUB_REF_NAME",
            "ciRunId": "$GITHUB_RUN_ID",
            "public": "public",
            "private": "private"
          }
          EOF
          cp staging/RELEASE.json staging/private/build/release.json
          php -l staging/public/index.php
          test -s staging/public/index.php
          test -s staging/public/.htaccess
          test -s staging/public/assets/chart.js
          test -s staging/public/assets/chart-diagnostics.js
          test -s staging/public/assets/rust-diagnostics.js
          test -s staging/public/assets/rust-stream-test.js
          test -s staging/private/app/src/RustStreamProbe.php
          test -s staging/public/assets/rust-admin.js
          test -s staging/public/assets/rust-activation-readiness.js
          test -s staging/public/admin-rust.php
          test -s staging/private/app/src/RustAdmin.php
          test -s staging/private/app/src/RustAdminBootstrap.php
          test ! -e staging/private/runtime/admin-setup-code.txt
          test -s staging/private/runtime/README.txt
          test ! -f staging/private/runtime/admin-auth.json
          test -s staging/private/app/src/RustDemoConfig.php
          test -s staging/private/app/src/RustSupervisor.php
          test -s staging/private/app/src/BrokerConnectionRepository.php
          test -s staging/private/app/src/FileMockBrokerConnectionRepository.php
          test -s staging/private/app/src/UserRepository.php
          test -s staging/private/app/src/FileUserRepository.php
          test -s staging/private/app/src/IdentityThrottle.php
          test -s staging/private/app/src/UserSession.php
          test -s staging/private/app/src/IdentityApi.php
          test -s staging/private/app/src/FileMockAccountSelection.php
          test -s staging/private/app/src/AccountApi.php
          test -s staging/private/app/src/SimulatedAccountBars.php
          test -s staging/private/app/src/FileMockWorkspaceRepository.php
          test -s staging/private/app/src/FileMockAuditLog.php
          test -s staging/public/account-dashboard.php
          test -s staging/public/assets/account-dashboard.js
          test -s staging/public/assets/account-dashboard.css
          test -s staging/public/assets/account-chart.js
          test -s staging/private/app/src/RustProbe.php
          test -x staging/private/app/bin/qsyn-stream
          test -s staging/RELEASE.json
          test -s staging/private/build/release.json
      - name: Publish DigiOps artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: staging/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  verify-artifact:
    name: Verify downloaded DigiOps entrypoint
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digiops-release
          path: verified-release
      - name: Validate exact artifact layout
        shell: bash
        run: |
          set -euo pipefail
          test -s verified-release/public/index.php
          test -s verified-release/public/.htaccess
          test -s verified-release/public/assets/chart.js
          test -s verified-release/public/assets/chart-diagnostics.js
          test -s verified-release/public/assets/rust-diagnostics.js
          test -s verified-release/public/assets/rust-stream-test.js
          test -s verified-release/private/app/src/RustStreamProbe.php
          test -s verified-release/public/assets/rust-admin.js
          test -s verified-release/public/assets/rust-activation-readiness.js
          test -s verified-release/public/admin-rust.php
          test -s verified-release/private/app/src/RustAdmin.php
          test -s verified-release/private/app/src/RustAdminBootstrap.php
          test ! -e verified-release/private/runtime/admin-setup-code.txt
          test -s verified-release/private/runtime/README.txt
          test ! -f verified-release/private/runtime/admin-auth.json
          test -s verified-release/private/app/src/RustDemoConfig.php
          test -s verified-release/private/app/src/RustSupervisor.php
          test -s verified-release/private/app/src/RustProbe.php
          test -s verified-release/private/app/src/FileStore.php
          test -s verified-release/private/app/src/BrokerConnectionRepository.php
          test -s verified-release/private/app/src/FileMockBrokerConnectionRepository.php
          test -s verified-release/private/app/src/UserRepository.php
          test -s verified-release/private/app/src/FileUserRepository.php
          test -s verified-release/private/app/src/IdentityThrottle.php
          test -s verified-release/private/app/src/UserSession.php
          test -s verified-release/private/app/src/IdentityApi.php
          test -s verified-release/private/app/src/FileMockAccountSelection.php
          test -s verified-release/private/app/src/AccountApi.php
          test -s verified-release/private/app/src/SimulatedAccountBars.php
          test -s verified-release/private/app/src/FileMockWorkspaceRepository.php
          test -s verified-release/private/app/src/FileMockAuditLog.php
          test -s verified-release/public/account-dashboard.php
          test -s verified-release/public/assets/account-dashboard.js
          test -s verified-release/public/assets/account-dashboard.css
          test -s verified-release/public/assets/account-chart.js
          test -s verified-release/private/app/bin/qsyn-stream
          test -s verified-release/RELEASE.json
          test -s verified-release/private/build/release.json
          grep -F 'RewriteBase /qsyn/' verified-release/public/.htaccess
          php -l verified-release/public/index.php
          php -r '$m=json_decode(file_get_contents("verified-release/RELEASE.json"),true,512,JSON_THROW_ON_ERROR); if(($m["schema"]??"")!=="DIGIOPS-BUILD/1" || ($m["public"]??"")!=="public") exit(1);'
          if test -d verified-release/public_html; then
            echo 'ERROR: nested public_html is not a DigiOps entrypoint' >&2
            exit 1
          fi
          echo 'PASS: DigiOps public/index.php, manifest and hidden rewrite rules included'
