name: QSYN Staging Access Diagnostics
on:
  push:
    branches: [probe/unified-terminal-stage-246]
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect stage HTTP status, headers, and 403 signature
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          paths=['/qsyn/','/qsyn/terminal','/qsyn/api/v1/health','/qsyn/api/v1/crypto/health?exchange=BINANCE&market=spot&symbol=BTCUSDT&interval=1m&limit=5']
          for path in paths:
              print('\nREQUEST',path)
              req=urllib.request.Request('https://stage.digiti.in'+path,headers={'Accept':'text/html,application/json','User-Agent':'QSYN-stage-246-http-diagnostics/1'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as res:
                      status=res.status; headers=dict(res.headers); body=res.read(320)
              except urllib.error.HTTPError as err:
                  status=err.code;headers=dict(err.headers);body=err.read(320)
              except Exception as err:
                  print('NETWORK_ERROR',str(err)[:220]);continue
              print('HTTP_STATUS',status)
              print('HEADER_SIGNATURE',{key:value for key,value in headers.items() if key.lower() in ('server','via','content-type','x-powered-by','cf-ray','x-sucuri-id','x-cache','location','www-authenticate','x-frame-options')})
              print('BODY_START',body.decode('utf-8',errors='replace')[:320].replace('\n',' '))
          PY
